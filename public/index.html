<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wallet</title>
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <button class="icon-btn" aria-label="Menü">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
    </button>
    <span class="topbar-title">Wallet</span>
    <button class="icon-btn" aria-label="Aktualisieren">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 5v6h-6"/>
      </svg>
    </button>
  </header>

  <div class="subbar">
    <button class="theme-btn" id="theme-btn" aria-label="Design wechseln">
      <svg class="sun-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
      </svg>
    </button>
    <span class="clock">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <span id="clock-text">00:00:00</span>
    </span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="abgelaufen">abgelaufen</button>
    <button class="tab is-active" data-tab="aktuell">aktuell</button>
    <button class="tab" data-tab="zukuenftig">zukünftig</button>
  </nav>

  <main class="stage">
    <section id="card-wrap" class="card-wrap" hidden>
      <article class="card" id="card">
        <div class="card-head">
          <img class="card-logo" src="images/Eingefügtes%20Bild.png" alt="Ruhr-Universität Bochum">
        </div>

        <h1 class="card-title">STUDIERENDENAUSWEIS</h1>

        <div class="fields">
          <div class="field span2">
            <span class="lbl">Vorname</span>
            <span class="val" id="f-vorname"></span>
          </div>
          <div class="field span2">
            <span class="lbl">Nachname</span>
            <span class="val" id="f-nachname"></span>
          </div>
          <div class="field">
            <span class="lbl">Geburtsdatum</span>
            <span class="val" id="f-geburtsdatum"></span>
          </div>
          <div class="field">
            <span class="lbl">Matrikelnummer</span>
            <span class="val" id="f-matrikelnummer"></span>
          </div>
          <div class="field span2">
            <span class="lbl">Hörerstatus</span>
            <span class="val" id="f-hoererstatus"></span>
          </div>
          <div class="field">
            <span class="lbl">Gültigkeit (von, bis)</span>
            <span class="val" id="f-von"></span>
          </div>
          <div class="field align-end">
            <span class="lbl">&nbsp;</span>
            <span class="val" id="f-bis"></span>
          </div>
        </div>

        <p class="disclaimer">Der Studierendenausweis ist nur in Verbindung mit einem gültigen Identifikationsnachweis gültig.</p>
      </article>
    </section>

    <section id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/>
      </svg>
      <p>Keine Dokumente</p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tabbar-item">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <span>Startseite</span>
    </button>
    <button class="tabbar-item is-active">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="13" rx="2.5"/>
        <path d="M16 10h5.5v5H16a2.5 2.5 0 0 1 0-5z"/>
        <circle cx="17.5" cy="12.5" r="0.75" fill="currentColor"/>
      </svg>
      <span>Wallet</span>
    </button>
  </nav>

</div>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Ausweis bearbeiten">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="sheet-btn" id="cancel">Abbrechen</button>
    <strong>Bearbeiten</strong>
    <button class="sheet-btn strong" id="save">Sichern</button>
  </div>
  <form class="sheet-body" id="form" autocomplete="off">
    <label>Vorname<input name="vorname" type="text"></label>
    <label>Nachname<input name="nachname" type="text"></label>
    <label>Geburtsdatum<input name="geburtsdatum" type="date"></label>
    <div class="field-group">
      <label for="in-matrikel">Matrikelnummer</label>
      <div class="input-row">
        <input id="in-matrikel" name="matrikelnummer" type="text" inputmode="numeric" maxlength="12">
        <button type="button" class="field-btn" id="btn-rand-matrikel" title="Zufällige 12-stellige Matrikelnummer generieren" aria-label="Zufällige Matrikelnummer generieren">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
          </svg>
          <span>Zufall</span>
        </button>
      </div>
    </div>
    <label>Hörerstatus<input name="hoererstatus" type="text"></label>
    <label>Gültig von<input name="gueltigVon" type="date"></label>
    <label>Gültig bis<input name="gueltigBis" type="date"></label>
    <button type="button" class="reset-btn" id="reset">Zurücksetzen</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
